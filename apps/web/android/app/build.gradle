import java.util.Properties

apply plugin: 'com.android.application'

// CI supplies signing material via environment variables; local builds may use
// the gitignored properties file. Partial configuration must never ship unsigned.
def releaseSigning = {
    def env = [
        storeFile: System.getenv('ANYANG_CHEMISTRY_KEYSTORE_FILE'),
        storePassword: System.getenv('ANYANG_CHEMISTRY_KEYSTORE_PASSWORD'),
        keyAlias: System.getenv('ANYANG_CHEMISTRY_KEY_ALIAS'),
        keyPassword: System.getenv('ANYANG_CHEMISTRY_KEY_PASSWORD'),
    ]
    def file = rootProject.file("keystore.properties")
    def material = null
    if (env.values().any { it != null }) {
        material = env
    } else if (file.exists()) {
        def props = new Properties()
        props.load(new FileInputStream(file))
        material = [
            storeFile: props.getProperty('storeFile'),
            storePassword: props.getProperty('storePassword'),
            keyAlias: props.getProperty('keyAlias'),
            keyPassword: props.getProperty('keyPassword'),
        ]
    }
    if (material && !material.values().any { !it }) {
        return material
    }
    return null
}()

android {
    namespace = "dev.co508.anyangchemistry"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "dev.co508.anyangchemistry"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1001
        versionName "0.1.1"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseSigning) {
                signingConfig signingConfigs.create("release", {
                    storeFile rootProject.file(releaseSigning.storeFile)
                    storePassword releaseSigning.storePassword
                    keyAlias releaseSigning.keyAlias
                    keyPassword releaseSigning.keyPassword
                })
            }
        }
        debug {
            applicationIdSuffix ".debug"
        }
    }

    // F-Droid builds must not include Google's opaque dependency metadata.
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
