import java.util.Properties

apply plugin: 'com.android.application'

// CI supplies signing material via environment variables; local builds may use
// the gitignored properties file. Partial configuration must never ship unsigned.
def releaseSigning = {
    def env = [
        storeFile: System.getenv('ANYANG_CHEMISTRY_KEYSTORE_FILE'),
        storePassword: System.getenv('ANYANG_CHEMISTRY_KEYSTORE_PASSWORD'),
        keyAlias: System.getenv('ANYANG_CHEMISTRY_KEY_ALIAS'),
        keyPassword: System.getenv('ANYANG_CHEMISTRY_KEY_PASSWORD'),
    ]
    def file = rootProject.file("keystore.properties")
    def material = null
    if (env.values().any { it != null }) {
        material = env
    } else if (file.exists()) {
        def props = new Properties()
        props.load(new FileInputStream(file))
        material = [
            storeFile: props.getProperty('storeFile'),
            storePassword: props.getProperty('storePassword'),
            keyAlias: props.getProperty('keyAlias'),
            keyPassword: props.getProperty('keyPassword'),
        ]
    }
    if (material && !material.values().any { !it }) {
        return material
    }
    return null
}()

// Beta signing is CI-only and deliberately independent of the release key. With
// no beta credentials the build type falls back to the debug key, so a local or
// fork build still compiles. See docs/beta-builds.md.
def betaSigning = {
    def env = [
        storeFile: System.getenv('ANYANG_BETA_KEYSTORE_FILE'),
        storePassword: System.getenv('ANYANG_BETA_KEYSTORE_PASSWORD'),
        keyAlias: System.getenv('ANYANG_BETA_KEY_ALIAS'),
        keyPassword: System.getenv('ANYANG_BETA_KEY_PASSWORD'),
    ]
    if (env.values().every { it != null && !it.trim().isEmpty() }) {
        return env
    }
    return null
}()

android {
    namespace = "dev.co508.anyangchemistry"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "dev.co508.anyangchemistry"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1002
        versionName "0.1.2"
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (releaseSigning) {
                signingConfig signingConfigs.create("release", {
                    storeFile rootProject.file(releaseSigning.storeFile)
                    storePassword releaseSigning.storePassword
                    keyAlias releaseSigning.keyAlias
                    keyPassword releaseSigning.keyPassword
                })
            }
        }
        debug {
            applicationIdSuffix ".debug"
        }
        beta {
            initWith release
            applicationIdSuffix ".beta"
            // Capacitor and its plugin modules only define debug/release, so
            // point beta's fallbacks at release or dependency resolution fails.
            matchingFallbacks = ['release']
            if (betaSigning) {
                signingConfig signingConfigs.create("beta", {
                    storeFile rootProject.file(betaSigning.storeFile)
                    storePassword betaSigning.storePassword
                    keyAlias betaSigning.keyAlias
                    keyPassword betaSigning.keyPassword
                })
            } else {
                signingConfig signingConfigs.getByName("debug")
            }
        }
    }

    // F-Droid builds must not include Google's opaque dependency metadata.
    dependenciesInfo {
        includeInApk = false
        includeInBundle = false
    }
}

// Keep defaultConfig's generated literals untouched for F-Droid — CI overrides
// only the beta outputs, using its monotonically increasing workflow run number.
androidComponents {
    onVariants(selector().withBuildType("beta")) { variant ->
        def versionCode = System.getenv('ANYANG_BETA_VERSION_CODE')
        def versionName = System.getenv('ANYANG_BETA_VERSION_NAME')
        variant.outputs.each { output ->
            if (versionCode != null) {
                output.versionCode.set(versionCode.toInteger())
            }
            if (versionName != null) {
                output.versionName.set(versionName)
            }
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'
