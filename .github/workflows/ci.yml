name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      typescript: ${{ steps.filter.outputs.typescript }}
      workflow: ${{ steps.filter.outputs.workflow }}
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          # paths-filter runs with token: "" below, so it needs enough history
          # to compare commits locally instead of calling the PR files API.
          fetch-depth: 0
          persist-credentials: false

      - id: filter
        uses: dorny/paths-filter@fbd0ab8f3e69293af611ebaee6363fc25e6d187d # v4
        with:
          # Keep the workflow at contents:read. Empty token forces git-based
          # detection and avoids requiring pull-requests:read.
          token: ""
          filters: |
            typescript:
              - "apps/**"
              - "packages/**"
              - "data/**"
              - "tsconfig.base.json"
              - "package.json"
              - "bun.lock"
              - "bunfig.toml"
              - "biome.json"
              - "scripts/*.sh"
            workflow:
              - ".github/workflows/**"

  typescript:
    needs: changes
    if: needs.changes.outputs.typescript == 'true' || needs.changes.outputs.workflow == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: step-security/harden-runner@ab7a9404c0f3da075243ca237b5fac12c98deaa5 # v2
        with:
          egress-policy: audit

      - uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5
        with:
          persist-credentials: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2
        with:
          bun-version: 1.3.13

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Biome
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Tests
        run: bun run test

      - name: Game data is up to date
        run: bun run data:build && git diff --exit-code data/game-data.json

      - name: Build
        run: bun run build

  ci-passed:
    if: always()
    needs:
      - changes
      - typescript
    runs-on: ubuntu-latest
    steps:
      - name: Check required jobs
        run: |
          changes_result='${{ needs.changes.result }}'
          typescript_result='${{ needs.typescript.result }}'
          if [ "$changes_result" != "success" ]; then
            echo "The changes job did not pass: changes=${changes_result}" >&2
            exit 1
          fi
          # Component jobs may be skipped by the path filter. That is healthy
          # only when path detection itself succeeded, which is checked above.
          for result in "$typescript_result"; do
            case "$result" in
              success|skipped)
                ;;
              *)
                echo "A required CI job did not pass: changes=${changes_result}, typescript=${typescript_result}" >&2
                exit 1
                ;;
            esac
          done
